apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskboard
  namespace: taskboard
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: taskboard
  template:
    metadata:
      labels:
        app: taskboard
    spec:
      containers:
      - name: web
        image: python:3.12-alpine
        imagePullPolicy: IfNotPresent
        command: ["python", "/app/server.py"]
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: APP_VERSION
          valueFrom:
            configMapKeyRef:
              name: taskboard-config
              key: APP_VERSION
        - name: PYTHONUNBUFFERED
          value: "1"
        volumeMounts:
        - name: source
          mountPath: /app
          readOnly: true
        startupProbe:
          httpGet: {path: /health, port: http}
          failureThreshold: 18
          periodSeconds: 5
        readinessProbe:
          httpGet: {path: /ready, port: http}
          periodSeconds: 5
        livenessProbe:
          httpGet: {path: /health, port: http}
          periodSeconds: 10
        resources:
          requests: {cpu: 25m, memory: 48Mi}
          limits: {cpu: 250m, memory: 128Mi}
      volumes:
      - name: source
        configMap:
          name: taskboard-source
